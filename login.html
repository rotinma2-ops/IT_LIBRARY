<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - IT Library</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d6efd, #4dabf7);
            display: flex;
            flex-direction: column;
        }

        /* ===== NAVBAR ===== */
        nav {
            background: #0d6efd;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        /* ===== LOGIN AREA ===== */
        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
        }

        .login-icon {
            width: 75px;
            height: 75px;
            background: #e8f2ff;
            color: #0d6efd;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            margin: 0 auto 20px;
        }

        .login-box h1 {
            text-align: center;
            color: #0d6efd;
            margin-bottom: 10px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0d6efd;
        }

        .remember {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember label {
            color: #555;
        }

        .forgot {
            color: #0d6efd;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* ===== BUTTON ===== */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0b5ed7;
        }

        /* ===== REGISTER ===== */
        .register {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .register a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            color: white;
            padding: 18px;
            background: rgba(0,0,0,0.15);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .login-box {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <nav>

        <div class="logo">
            📚 IT Library
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="books.html">
                Books
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

        </div>

    </nav>


    <!-- ===== LOGIN ===== -->
    <div class="login-container">

        <div class="login-box">

            <div class="login-icon">
                👤
            </div>

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to your IT Library account
            </p>


            <form onsubmit="alert('Login is not available yet.'); return false;">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="remember">

                    <label>
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="#" class="forgot">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="login-btn">
                    Login 🔐
                </button>

            </form>


            <div class="register">

                Don't have an account?

                <a href="#">
                    Register
                </a>

            </div>

        </div>

    </div>


    <!-- ===== FOOTER ===== -->
    <footer>

        © 2026 IT Library. All Rights Reserved.

    </footer>

</body>
</html>
